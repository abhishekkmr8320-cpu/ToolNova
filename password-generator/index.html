<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator | ToolNova</title>

<meta name="description" content="Generate strong, secure passwords instantly.">

<link rel="stylesheet" href="../css/style.css">

<style>

.container{
max-width:800px;
margin:60px auto;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.option{
margin:20px 0;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input[type=number]{
width:100%;
padding:14px;
font-size:18px;
border-radius:10px;
border:1px solid #ddd;
}

input[type=checkbox]{
margin-right:10px;
}

.password{
margin-top:30px;
padding:18px;
background:#f5f5f5;
border-radius:12px;
font-size:22px;
word-break:break-all;
}

button{
margin-top:20px;
padding:15px;
width:100%;
background:#111827;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
font-size:17px;
}

button:hover{
background:#000;
}

.copy{
background:#16a34a;
}

.copy:hover{
background:#15803d;
}

</style>

</head>

<body>

<header class="navbar">

<div class="logo">

ToolNova

</div>

<nav>

<a href="../index.html">Home</a>

<a href="#">Password Generator</a>

</nav>

</header>

<div class="container">

<h1>

Password Generator

</h1>

<div class="option">

<label>Password Length</label>

<input
type="number"
id="length"
value="16"
min="4"
max="100">

</div>

<div class="option">

<label>

<input
type="checkbox"
id="upper"
checked>

Uppercase

</label>

<label>

<input
type="checkbox"
id="lower"
checked>

Lowercase

</label>

<label>

<input
type="checkbox"
id="number"
checked>

Numbers

</label>

<label>

<input
type="checkbox"
id="symbol"
checked>

Symbols

</label>

</div>

<button onclick="generatePassword()">

Generate Password

</button>

<div
class="password"
id="password">

Click Generate

</div>

<button
class="copy"
onclick="copyPassword()">

Copy Password

</button>

</div>

<script>

function generatePassword(){

let chars="";

if(document.getElementById("upper").checked)

chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

if(document.getElementById("lower").checked)

chars+="abcdefghijklmnopqrstuvwxyz";

if(document.getElementById("number").checked)

chars+="0123456789";

if(document.getElementById("symbol").checked)

chars+="!@#$%^&*()_+-={}[]<>?/";

if(chars===""){

alert("Select at least one option");

return;

}

let length=parseInt(document.getElementById("length").value);

let password="";

for(let i=0;i<length;i++){

password+=chars.charAt(Math.floor(Math.random()*chars.length));

}

document.getElementById("password").innerHTML=password;

}

function copyPassword(){

navigator.clipboard.writeText(

document.getElementById("password").innerText

);

alert("Password copied");

}

generatePassword();

</script>

</body>

</html>
