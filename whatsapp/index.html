<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WhatsApp Direct Message | ToolNova</title>

<meta name="description" content="Send WhatsApp messages without saving phone numbers. Free, secure and instant.">

<link rel="stylesheet" href="../css/style.css">

<style>

.tool-container{
max-width:800px;
margin:60px auto;
padding:30px;
background:#fff;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.tool-container h1{
text-align:center;
margin-bottom:10px;
}

.tool-container p{
text-align:center;
color:#666;
margin-bottom:30px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
font-weight:600;
margin-bottom:8px;
}

input,
select,
textarea{

width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;

}

textarea{
resize:vertical;
height:120px;
}

button{

width:100%;
padding:16px;
background:#25D366;
color:#fff;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
font-weight:bold;

}

button:hover{

background:#128C7E;

}

.result{

margin-top:25px;
display:none;

}

.result input{

background:#f5f5f5;

}

.copyBtn{

margin-top:15px;
background:#111827;

}

.copyBtn:hover{

background:#000;

}

</style>

</head>

<body>

<header class="navbar">

<div class="logo">

ToolNova

</div>

<nav>

<a href="../index.html">Home</a>

<a href="#">WhatsApp Tools</a>

</nav>

</header>

<div class="tool-container">

<h1>

WhatsApp Direct Message

</h1>

<p>

Send WhatsApp message without saving contact.

</p>

<div class="form-group">

<label>

Country Code

</label>

<select id="country">

<option value="91">🇮🇳 India (+91)</option>

<option value="1">🇺🇸 USA (+1)</option>

<option value="44">🇬🇧 UK (+44)</option>

<option value="971">🇦🇪 UAE (+971)</option>

<option value="880">🇧🇩 Bangladesh (+880)</option>

<option value="977">🇳🇵 Nepal (+977)</option>

</select>

</div>

<div class="form-group">

<label>

Phone Number

</label>

<input
type="tel"
id="phone"
placeholder="9876543210">

</div>

<div class="form-group">

<label>

Message (Optional)

</label>

<textarea
id="message"
placeholder="Type your message..."></textarea>

</div>

<button onclick="generateLink()">

Open in WhatsApp

</button>

<div class="result" id="result">

<label>

Generated Link

</label>

<input
type="text"
id="link"
readonly>

<button
class="copyBtn"
onclick="copyLink()">

Copy Link

</button>

</div>

</div>

<script>

function generateLink(){

let country=document.getElementById("country").value;

let phone=document.getElementById("phone").value.trim();

let message=document.getElementById("message").value.trim();

phone=phone.replace(/\D/g,'');

if(phone.length<6){

alert("Enter valid phone number");

return;

}

let url="https://wa.me/"+country+phone;

if(message!=""){

url+="?text="+encodeURIComponent(message);

}

document.getElementById("result").style.display="block";

document.getElementById("link").value=url;

window.open(url,"_blank");

}

function copyLink(){

let input=document.getElementById("link");

input.select();

document.execCommand("copy");

alert("Copied");

}

</script>

</body>

</html>
